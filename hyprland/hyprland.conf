# Hyprland configuration — clean default for a fresh install, paired with Noctalia as
# the shell/bar. Wiki: https://wiki.hypr.land/Configuring/

monitor = , preferred, auto, 1

exec-once = xwayland-satellite
exec-once = noctalia

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ff)
    col.inactive_border = rgba(565f89ff)
    layout = dwindle
}

decoration {
    rounding = 8
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

$mod = SUPER

bind = $mod, RETURN, exec, ghostty
bind = $mod, T, exec, ghostty
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, D, togglefloating

# Noctalia panels
bind = $mod, SPACE, exec, noctalia msg panel-toggle control-center
bind = $mod, S, exec, noctalia msg panel-toggle launcher
bind = $mod, V, exec, noctalia msg panel-toggle clipboard
bind = $mod, COMMA, exec, noctalia msg settings-toggle
bind = $mod ALT, L, exec, noctalia msg session lock
bind = $mod SHIFT, S, exec, noctalia msg screenshot-region

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Hardware keys, via Noctalia IPC
bindl = , XF86AudioRaiseVolume, exec, noctalia msg volume-up
bindl = , XF86AudioLowerVolume, exec, noctalia msg volume-down
bindl = , XF86AudioMute, exec, noctalia msg volume-mute
bindl = , XF86MonBrightnessUp, exec, noctalia msg brightness-up
bindl = , XF86MonBrightnessDown, exec, noctalia msg brightness-down
bindl = , XF86AudioPlay, exec, noctalia msg media toggle
bindl = , XF86AudioNext, exec, noctalia msg media next
bindl = , XF86AudioPrev, exec, noctalia msg media previous
